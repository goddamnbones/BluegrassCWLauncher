[package]
name = "bluegrasslauncher"
version = "0.1.7"
description = "Bluegrass launcher: starts Project Zomboid with ZombieBuddy and PZO for one launch"
authors = ["Bluegrass"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows (cargo issue 8519)
name = "bluegrasslauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "2"
sha2 = "0.10"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_Foundation"] }
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
